name: Vaillant Genia Air
version: "0.7.0"
slug: genia_air
description: Standalone control & optimization for Vaillant Genia Air — bundled ebusd daemon, dashboard, history
url: https://github.com/onemanfoundry/ha-genia-air
arch:
  - aarch64
  - amd64
startup: services
init: false
hassio_api: true
homeassistant_api: true
services:
  - mqtt:need
ingress: true
panel_icon: mdi:heat-pump
panel_title: Genia Air
panel_admin: false
uart: true
map:
  - share:rw
options:
  ebus_device: "ens:192.168.1.100:9999"
  topic_prefix: ebusd
  zone_count: 1
  optimize_flow_temp: true
  target_delta_t: 5.0
  min_flow_temp_safe: 14.0
  max_flow_temp_safe: 35.0
  summer_temp_limit: 19.0
  optimize_cycle_minutes: 5
  ebusd_log_level: "notice"
  log_level: info
  control_session_minutes: 60
  control_ack_grace_minutes: 15
  control_notify_target: ""
  stale_data_minutes: 20
  simulate_hardware: false
schema:
  ebus_device: str
  topic_prefix: str
  zone_count: int(1,3)
  optimize_flow_temp: bool
  target_delta_t: float(2.0,10.0)
  min_flow_temp_safe: float(10.0,20.0)
  max_flow_temp_safe: float(25.0,55.0)
  summer_temp_limit: float(15.0,25.0)
  optimize_cycle_minutes: int(1,60)
  ebusd_log_level: list(error|notice|info|debug)
  log_level: list(debug|info|warning|error)
  control_session_minutes: int(5,240)
  control_ack_grace_minutes: int(5,120)
  control_notify_target: str
  stale_data_minutes: int(5,120)
  simulate_hardware: bool
